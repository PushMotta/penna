name: test

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repository and runs tests: it publishes nothing, comments nowhere and uploads no artifact.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Pinned to full commit SHAs rather than moving tags; update them deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Model.js holds the plugin's logic; the tests need no compositor and no daemon.
      - name: Model tests
        run: node --test test/model.test.js test/studio.test.js
