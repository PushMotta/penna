# An Intel Mac, as applesmc documents it up to 7.2 (DESIGN.md §3.5; drivers/hwmon/applesmc.c at v7.2): registered the old way,
# so its attributes are on the platform device, not its hwmon directory; per fan `fanN_output` in RPM, `fanN_min`, `fanN_max`,
# and `fanN_manual`, 1 manual and 0 automatic; no pwm. A Documented fixture. The CPU is an Intel
# Core i9-9880H, as in a MacBook Pro 16 (2019).
name = "applesmc-7.2"
cpu_model = "Intel(R) Core(TM) i9-9880H CPU @ 2.30GHz"
ambient = 24.0
seed = 9
config = "applesmc.config.toml"
seconds = 600
fresh = true

[load]
points = [{ at = 0, cpu = 0.03, gpu = 0.0 }]

[[body]]
id = "cpu"
load = "cpu"
capacity = 18.0
idle_watts = 6.0
load_watts = 45.0
passive = 0.15
airflow = 1.2
fan = [{ id = "fan1", weight = 1.0 }, { id = "fan2", weight = 1.0 }]

[[chip]]
driver = "coretemp"
path = "devices/platform/coretemp.0"
hwmon = 3
temp = [{ channel = 1, label = "Package id 0", body = "cpu", noise = 0.4, spikes = 5.0, crit = 100.0 }]

[[chip]]
driver = "applesmc"
path = "devices/platform/applesmc.768"
hwmon = 4
legacy = true
temp = [{ channel = 1, label = "TC0P", body = "cpu", offset = -4.0, noise = 0.2 }]

[[chip.target]]
channel = 1
min = 1200
max = 5500
switch = "manual"
firmware = { body = "cpu", points = [[40, 22], [70, 60], [90, 100]] }

[[chip.target]]
channel = 2
min = 1200
max = 5500
switch = "manual"
firmware = { body = "cpu", points = [[40, 22], [70, 60], [90, 100]] }

[[chip.fan]]
channel = 1
id = "fan1"
pwm = 1
max_rpm = 5500
stop = 8
start = 10

[[chip.fan]]
channel = 2
id = "fan2"
pwm = 2
max_rpm = 5500
stop = 8
start = 10
