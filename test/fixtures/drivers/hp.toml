# An HP laptop without manual fan control, as hp-wmi documents it (DESIGN.md §3.5; drivers/platform/x86/hp/hp-wmi.c at v7.3):
# `pwm1_enable` alone, 0 full speed and 2 automatic, for both fans, and the firmware's platform profile. Penna holds the fans in
# automatic so Full speed and emergencies reach them, and the power profile is its fan lever. A Documented fixture. The CPU is
# an Intel Core Ultra 7 155H, as in an HP EliteBook.
name = "hp"
cpu_model = "Intel(R) Core(TM) Ultra 7 155H"
ambient = 24.0
seed = 11
config = "hp.config.toml"
seconds = 600
fresh = true
platform = { choices = ["low-power", "balanced", "performance"], profile = "balanced" }

[load]
points = [{ at = 0, cpu = 0.03, gpu = 0.0 }]

[[body]]
id = "cpu"
load = "cpu"
capacity = 16.0
idle_watts = 5.0
load_watts = 40.0
passive = 0.15
airflow = 1.2
fan = [{ id = "fan1", weight = 1.0 }, { id = "fan2", weight = 1.0 }]

[[chip]]
driver = "coretemp"
path = "devices/platform/coretemp.0"
hwmon = 3
temp = [{ channel = 1, label = "Package id 0", body = "cpu", noise = 0.4, spikes = 5.0, crit = 110.0 }]

[[chip]]
driver = "hp"
path = "devices/platform/hp-wmi"
hwmon = 7

[[chip.pwm]]
channel = 1
enable = 2
modes = true
firmware = { body = "cpu", points = [[44, 0], [45, 25], [70, 60], [85, 100]] }

[[chip.fan]]
channel = 1
id = "fan1"
pwm = 1
max_rpm = 5100
stop = 15
start = 20

[[chip.fan]]
channel = 2
id = "fan2"
pwm = 1
max_rpm = 4900
stop = 15
start = 20
