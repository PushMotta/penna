name: test

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repository and runs tests: it publishes nothing, comments nowhere and uploads no artifact.
# Every job inherits this floor, so a step that later needs more has to ask.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs rather than to moving tags: a tag can be repointed by whoever owns it, and the
      # code behind it then runs here with this workflow's token. Update them deliberately, checking what changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own rustup, so no third-party action runs here.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every test runs against the simulator, the mock and fixtures: nothing here touches the runner's own fans.
      - name: Tests
        run: cargo test --workspace --locked

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Model tests
        working-directory: plugin
        run: node --test test/model.test.js test/studio.test.js
